name: Undercover
options:
  bundleIdPrefix: com.julesbesson
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  Undercover:
    type: application
    platform: iOS
    sources:
      - path: Undercover
      # Référence de dossier : tout CSV déposé dans words/ est embarqué au build,
      # sans avoir à relancer `xcodegen generate`.
      - path: words
        type: folder
    info:
      path: Undercover/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julesbesson.undercover
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  UndercoverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UndercoverTests
    dependencies:
      - target: Undercover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  Undercover:
    build:
      targets:
        Undercover: all
        UndercoverTests: [test]
    test:
      targets:
        - UndercoverTests
    run:
      config: Debug
